name: Automated Testing Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=. --cov-report=xml --cov-report=term-missing -m unit

    - name: Run integration tests
      run: |
        pytest tests/integration -v --cov=. --cov-append --cov-report=xml -m integration

    - name: Run API tests
      run: |
        pytest tests/api -v --cov=. --cov-append --cov-report=xml -m api

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage

    - name: Generate coverage badge
      run: |
        coverage report --format=total > coverage.txt
        echo "COVERAGE=$(cat coverage.txt)" >> $GITHUB_ENV

  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: react_src/package-lock.json

    - name: Install dependencies
      working-directory: ./react_src
      run: npm ci

    - name: Run tests
      working-directory: ./react_src
      run: npm test -- --coverage --watchAll=false

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./react_src/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  lint-and-security:
    name: Linting & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -ll

    - name: Check for known vulnerabilities
      run: |
        safety check --json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json

  test-summary:
    name: Test Summary
    needs: [backend-tests, frontend-tests, lint-and-security]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Backend Tests: ${{ needs.backend-tests.result }}"
        echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
        echo "Security Checks: ${{ needs.lint-and-security.result }}"

    - name: Determine overall status
      if: |
        needs.backend-tests.result == 'failure' ||
        needs.frontend-tests.result == 'failure'
      run: exit 1
