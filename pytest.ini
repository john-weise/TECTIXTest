[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --ignore=react_src
    --ignore=react_build
    --ignore=engine/tests.py
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    slow: Slow running tests
    auth: Authentication tests
