apiVersion: apps/v1
kind: Deployment
metadata:
  name: atoaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atoaas
  template:
    metadata:
      labels:
        app: atoaas
    spec:
      containers:
      - name: atoaas
        image: atoaas:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: atoaas-service
spec:
  type: NodePort
  selector:
    app: atoaas
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30480  # Visit this to hit the svc. You can change external port here too

