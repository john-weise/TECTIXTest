[emass]
# Base URL of the eMASS API (no trailing slash)
api_base = https://connect.emass.apps.mil/api
# API key for authentication
api_key = REPLACE_WITH_REAL_API_KEY

# One of the following auth setups:
# - PEM pair (cert_path + key_path), OR
# - PFX bundle (pfx_path + pfx_pass)
cert_path =
key_path =
pfx_path = /app/certs/eMASSAPIKey.pfx
pfx_pass = CHANGEME

# TLS verification: true | false | /path/to/custom_ca.pem
verify = true

# Organization ID set later
org_id = 20

# Optional default system ID (can be overridden by CLI/env)
system_id = 101

[paths]
# Checklist is relatively static (override via CLI/env if needed)
checklist = /app/static/DeepDiveTests.xlsx
# Optional demo assets path
demo_assets = /app/Notionalassets

[logging]
# "stdout" (recommended in containers) or "file"
destination = stdout
# Only used when destination=file
file = /app/logs/ato_tests.log
level = INFO
# Keep the format simple & readable in aggregated logs
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
